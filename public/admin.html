
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusFind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">CampusFind</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="admin.html">Admin Dashboard</a>
            <a href="admin-claims.html">Manage Claims</a>
            <button id="logoutBtn">Logout</button>

        </nav>
    </header>

    <!-- Admin Dashboard -->
    <section class="dashboard-section">

        <h1>Admin Dashboard</h1>
        <p id="welcomeMessage">Welcome, Admin!</p>

        <!-- Statistics -->
        <div class="dashboard-stats">

            <div class="stat-card">
                <h3>Total Items</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Lost Items</h3>
                <p id="lostCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Found Items</h3>
                <p id="foundCount">0</p>
            </div>

        </div>

        <!-- All Reported Items -->
        <h2>All Reported Items</h2>

        <div id="adminItemsList" class="dashboard-items">
            <p>Loading items...</p>
        </div>

    </section>

    <script src="js/admin.js"></script>

</body>
</html>
